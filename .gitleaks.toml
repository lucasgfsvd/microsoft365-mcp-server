# Extends the stock gitleaks ruleset rather than replacing it, so new upstream
# rules are picked up automatically.
[extend]
useDefault = true

[allowlist]
description = "Generated files and known-public identifiers"

paths = [
  # Generated. Base64 integrity hashes look like high-entropy secrets.
  '''package-lock\.json''',
  # Generated by scripts/generate-notice.mjs from the dependency tree.
  '''NOTICE\.md''',
  # Placeholders only, by design — real values live outside the repo.
  '''\.env\.example''',
]

regexes = [
  # Microsoft's own published "Graph Command Line Tools" public client id,
  # used as the documented fallback in src/config.ts. A public client has no
  # secret, and this value is in Microsoft's own docs — not a credential.
  '''14d82eec-204b-4c2f-b7e8-296a70dab67e''',
]
