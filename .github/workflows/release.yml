name: Release

on:
  push:
    tags: ["v*.*.*"]

# npm only: the project is published once and not maintained, so no container
# image is pushed (an unmaintained image accumulates base-image CVEs). The
# Dockerfile stays, and CI builds and starts it.
permissions:
  contents: read
  id-token: write

jobs:
  # Nothing is published unless the tagged commit passes the same gates as CI,
  # and the tag names the version package.json actually carries.
  verify:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - id: version
        name: Tag must match package.json
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          # A hyphen marks a pre-release (v0.2.0-rc.1): it must not become "latest".
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Package contents
        run: npm pack --dry-run

  npm:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public --tag ${{ needs.verify.outputs.prerelease == 'true' && 'next' || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
