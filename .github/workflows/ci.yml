name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      # Hard gate: production dependencies must stay clear of high-severity
      # advisories. The `overrides` block in package.json pins patched
      # transitives; if a new advisory lands, this fails the build.
      - run: npm audit --omit=dev --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: a secret that was committed and later removed is
          # still in the objects, so scanning only the tip would miss it.
          fetch-depth: 0
      - name: Scan history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: microsoft365-mcp-server:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Building proves nothing about starting. The runtime image has no
      # libsecret, which once killed the process at import; make sure it still
      # comes up and answers an MCP initialize.
      - name: Smoke test (starts and answers initialize)
        run: |
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          (echo "$init"; sleep 5) \
            | timeout 30 docker run --rm -i microsoft365-mcp-server:ci > out.txt 2> err.txt || true
          cat err.txt
          grep -q '"serverInfo"' out.txt
          grep -q 'ready (stdio)' err.txt
